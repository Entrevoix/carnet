# DRAFT fdroiddata metadata for main F-Droid inclusion (Phase 2 of #182).
# Destination: fdroiddata repo as metadata/com.ventouxlabs.carnet.yml
# Status: UNSUBMITTED — validate with `fdroid lint`/`fdroid build` on the
# fdroidserver toolchain before opening the fdroiddata merge request. Expect
# iteration: Expo/React Native recipes usually need buildserver-side tweaks
# (sudo block for Node, srclib pins). This draft encodes what THIS repo needs.

Categories:
  - Writing
License: AGPL-3.0-only
SourceCode: https://github.com/Entrevoix/carnet
IssueTracker: https://github.com/Entrevoix/carnet/issues
Changelog: https://github.com/Entrevoix/carnet/releases

AutoName: Carnet

RepoType: git
Repo: https://github.com/Entrevoix/carnet.git

Builds:
  - versionName: 0.7.0
    versionCode: 5
    commit: v0.7.0
    subdir: apps/mobile
    sudo:
      # Node 20+ and npm are required for the workspace build (see
      # .github/actions/android-toolchain/action.yml for the CI equivalent).
      - apt-get update
      - apt-get install -y npm nodejs
    init:
      # Workspace install from the repo root; postinstall runs patch-package
      # (two committed patches, no network beyond the npm registry).
      - cd ../.. && npm ci
    prebuild:
      # Build the shared workspace package, then generate android/ fresh from
      # app.json (the android/ directory is intentionally NOT in git).
      - cd ../.. && npm run build:shared
      - npx expo prebuild --platform android --clean --no-install
    gradle:
      - yes
    # The tentap editor web bundle is pre-built and committed
    # (apps/mobile/editor-web/generated/), so no vite build is needed here.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 0.7.0
CurrentVersionCode: 5

# Open questions for the fdroiddata MR (tracked in issue #182):
# 1. Signing: F-Droid-signed builds (default) vs reproducible+upstream-signed.
#    The release cert SHA-256 is pinned in-repo if reproducible mode is pursued.
# 2. Hermes/gradle determinism has not been verified on the buildserver.
# 3. scanignore may be needed for the committed editor-web/generated bundle
#    (large pre-built HTML/JS — source and build script live in-repo at
#    apps/mobile/editor-web/, npm script `editor:build`).
